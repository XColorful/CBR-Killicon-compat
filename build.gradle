plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

allprojects {
    group = mod_group_id
    version = mod_version

    repositories {
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            url "https://www.cursemaven.com"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            forRepositories(maven { url = "https://maven.minecraftforge.net/" })
            filter {
                includeGroup "maven.modrinth"
            }
        }
    }
}
